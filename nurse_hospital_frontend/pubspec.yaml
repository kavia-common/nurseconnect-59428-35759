name: nurse_hospital_frontend
description: "NurseConnect – a Flutter app connecting nurses with hospitals using modern UI, maps, payments, and notifications."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path: ^1.9.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  google_maps_flutter: ^2.9.0
  flutter_slidable: ^3.1.0
  flutter_local_notifications: ^17.2.3
  # Removed awesome_notifications due to Android build incompatibility with Flutter 3.x APIs.
  # Re-add a Flutter 3+ compatible version later if native notifications are needed.
  badges: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_rating_bar: ^4.0.1
  # Stripe SDK
  flutter_stripe: ^11.1.0
  # Local database (for caching/offline)
  sqflite: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
